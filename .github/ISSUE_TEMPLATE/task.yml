name: 작업 이슈
description: 개발 작업을 명확히 정의합니다.
title: "[작업] "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: 작업 목적
      description: 이 작업으로 달성하려는 결과를 적어 주세요.
      placeholder: 예) 한식 메뉴를 조회하고 선택할 수 있도록 구현합니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 구현할 항목을 체크리스트로 작성해 주세요.
      value: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 기준
      description: 작업이 완료되었다고 판단할 기준을 적어 주세요.
      value: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 디자인, 관련 이슈, 문서 링크 등이 있으면 남겨 주세요.
    validations:
      required: false
